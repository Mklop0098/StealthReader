[package]
name = "stealth-reader-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri shell for Stealth Reader"

[lib]
name = "stealth_reader_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
stealth-core = { path = "../../../crates/stealth-core" }
tauri = { version = "2.12.2", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-global-shortcut = "2.4.0"
